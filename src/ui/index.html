    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      .app-bootstrap-loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-bootstrap-spinner {
        width: 32px;
        height: 32px;
        border: 4px solid #e5e7eb;
        border-top-color: #6b7280;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-bootstrap-loading">
        <div
          class="app-bootstrap-spinner"
          role="status"
          aria-label="Загрузка"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
